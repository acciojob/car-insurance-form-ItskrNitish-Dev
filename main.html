<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
	<div class="container">
	<h1>Car Insurance Registration Form</h1>
	<form method="post">
		<div class="form">
			<label for="name">Name:</label>
		    <input 
				type="text" 
				id="name" 
				name="name" 
				placeholder="Enter your name: " 
				required
			>
		</div>
		

		<div class="form">
			<label for="email">Email:</label>
		    <input 
				type="email" 
				id="email" 
				name="email" 
				placeholder="Enter your email: " 
				required
			>
		</div>

		<div class="form">
                <label>Gender:</label>

                <div class="radio-btn">
                    <input
                        type="radio"
                        id="male"
                        name="gender"
                        value="Male"
                        required
                    >
                    <label for="male">Male</label>

                    <input
                        type="radio"
                        id="female"
                        name="gender"
                        value="Female"
                    >
                    <label for="female">Female</label>
                </div>
            </div>

		<div class="form">
                <label for="cars">Select Car Brands:</label>
                <select id="cars" name="cars">
                    <option value="">Select a car brand</option>
                    <option value="BMW">BMW</option>
                    <option value="Audi">Audi</option>
                    <option value="Mercedez">Mercedez</option>
                </select>
        </div>

		<div class="form">
			<label for="carage">Car Age :</label>
		    <input 
				type="number" 
				id="carage" 
				name="carage" 
				placeholder="Enter Car Age: " 
				required
			>
		</div>

		<div class="form">
			<label for="dop">Date of Purchase (dop) :</label>
		    <input 
				type="date" 
				id="dop" 
				name="dop"  
				required
			>
		</div>

		<div class="form">
			<label for="password">Password :</label>
			<input
				type="password"
				id="password"
				name="password"
				placeholder="Enter your password:"
				required
			>
		<div/>

		<button type="submit">Submit</button>	
		
	</form>
	</div>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
